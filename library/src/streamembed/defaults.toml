# StreamEmbed defaults. Do not edit this file: change a setting with `streamembed config set KEY VALUE` (or
# streamembed.set_config(KEY=VALUE)), which writes your own config file (`streamembed config path` shows where).
# Precedence: a value given to a function or command, then configure() (for its process), then $STREAMEMBED_INDEX /
# $STREAMEMBED_MODELS, then your file, then this file.

# Where the index lives
index_dir = "~/screenshot_index"
# Where live captures are written, as a full path ("": captures/ inside index_dir), in YYYY-MM-DD subfolders named <ms>.jpg /
# <ms>_1.jpg. It can be your screenshots folder: indexing it later leaves these out. Screenshots indexed from a folder are never copied; the index keeps
# only vectors and the time and path of each image.
capture_dir = ""
# How live captures are saved: "webp" (about half the size of "jpeg" at the same quality) and their width in pixels (0: the screen's
# own size, sharper when zoomed in, about 3.5 times larger). The model always sees them fitted to `width`.
capture_format = "webp"
capture_width = 1280
# Live captures are kept under this many GB (images only; 0: no limit). Past it, the oldest are removed, with their screens in the
# index, until they take 90 % of it. Live captures older than capture_keep_days are removed too (0: kept however old). Checked when
# the capture starts and every hour. Screenshots indexed from a folder are never removed.
capture_max_gb = 20.0
capture_keep_days = 0.0
# "flat" (exact), "binary" (1-bit codes + exact re-rank above 1,000 screens), "hnsw" (graph; pip install "streamembed[hnsw]"),
# "ivf" (k-means lists) or "pq" (k-means lists + product-quantized codes); hnsw, ivf and pq search exactly up to 10,000 screens
index_type = "flat"

# Model: a name from streamembed.available_models(), the Hugging Face repo that lists them, and the device ("auto", "mps", "cuda", "cuda:N", "cpu")
model = "qwen3-vl-2b"
models_repo = "dayoon/streamembed"
device = "auto"
# Screenshots wider than this are shrunk to it (pixels); narrower ones are left as they are
width = 1280

# Capture: seconds between captures (0 to 86400; live capture uses at least 0.5; for a folder, 0 keeps every screenshot), which displays
# ("all", "primary", or display numbers such as [1, 2]), and whether screens that did not change are skipped
interval = 5.0
monitors = "all"
skip_unchanged = true
# A screen that changed a little (under 10 % of its blocks, such as a few typed characters or a clock) is stored at most once per this
# many seconds; a screen that changed more is stored at once, and one that did not change is not stored.
heartbeat = 300.0
# Nothing is captured while the frontmost app or window title contains one of these (case-insensitive). A value you set replaces the
# whole list: to add one, list these too
exclude_apps = ["1password", "bitwarden", "dashlane", "lastpass", "keychain access", "keepass"]
exclude_titles = ["private browsing", "incognito", "inprivate"]

# Search: results per question
top_k = 10
# Results page: results put on the page (to pick dates among) and frames shown before and after each result
page_results = 100
context = 15
